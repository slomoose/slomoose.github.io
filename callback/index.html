<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesla authorization</title>
<style>body{font-family:sans-serif;padding:20px;font-size:18px}textarea{width:100%;height:120px;font-size:16px}button{font-size:20px;padding:12px 20px;margin-top:10px}</style></head>
<body><h2>Almost done</h2><p>Copy this code and paste it into the secure box in your Home Manager chat.</p>
<textarea id="c" readonly></textarea><br><button onclick="navigator.clipboard.writeText(document.getElementById('c').value);this.textContent='Copied!'">Copy code</button>
<script>var p=new URLSearchParams(location.search);document.getElementById('c').value=p.get('code')||('No code found. '+(p.get('error_description')||p.get('error')||''));</script>
</body></html>
